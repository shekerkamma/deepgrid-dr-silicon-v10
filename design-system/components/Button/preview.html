<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{padding:20px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.lbl{font:500 .75rem/1.4 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
:focus-visible{outline:var(--focus-width) solid var(--copper-ring);outline-offset:3px}
</style></head><body>
<div class="wrap">
<button class="btn">Download the datasheet</button>
<button class="btn" disabled>Request evaluation kit</button>
<a class="link" href="#">Read the fault path →</a>
</div>
<style>.btn{font:500 .875rem/1.2 var(--font-sans);background:var(--copper);color:var(--on-copper);border:0;border-radius:var(--radius-sm);padding:var(--pad-button-y) var(--pad-button-x);min-height:var(--control-min);cursor:pointer;transition:background-color .15s,transform .15s}
.btn:hover{background:var(--copper-ring)}.btn:disabled{opacity:.4;cursor:not-allowed}
.link{color:var(--copper);text-decoration:underline;text-underline-offset:3px;font-size:.9375rem}</style>
</body></html>
