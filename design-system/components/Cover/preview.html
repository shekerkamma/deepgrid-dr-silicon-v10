<!-- @dsCard height=288 -->
<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:288px;background:var(--ink);overflow:hidden}
.c{position:relative;width:960px;height:288px}
svg{position:absolute;inset:0}
.copper{fill:var(--copper)}.hw{fill:var(--hardware)}.paper{fill:var(--paper)}.ink2{fill:var(--ink-2)}.cpu{fill:var(--cpu)}
.r{rx:var(--radius-md)}.rs{rx:var(--radius-xs)}
.rule{stroke:var(--ink);stroke-width:var(--hairline)}
.t{position:absolute;left:32px;bottom:32px;max-width:440px}
.n{margin:0;font:400 96px/.95 var(--font-serif);letter-spacing:-.025em;color:var(--paper)}
.g{margin:12px 0 0;font:400 13px/1.4 var(--font-sans);color:var(--muted-foreground)}
</style></head><body><div class="c">
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<!-- blocks: copper 208x136, hardware 224x136, paper 208x136, ink-2 164x128, cpu 44x44 (control-min); sides from pad-card-y (16) gaps and control-min.
     arrangement: the brand mark's 2x2 modular grid at x>=512, bleeding off top, right and bottom; the fourth tile shifted 8px like the mark's offset square.
     pattern: editorial row ("borders not shadows", serif verdicts, hairline rules between sections) -> four `rule`-weight hairlines cut in the `ink` ground across the blocks.
     steps and radii: gap pad-card-y 16, offset 8, radius-md on tiles, radius-xs on the cpu pip, hairline 1px. -->
<rect class="copper r" x="512" y="-8" width="208" height="144"/>
<rect class="hw r" x="736" y="-8" width="232" height="144"/>
<rect class="paper r" x="512" y="152" width="208" height="144"/>
<rect class="cpu rs" x="736" y="152" width="44" height="44"/>
<rect class="ink2 r" x="796" y="160" width="172" height="136"/>
<line class="rule" x1="496" y1="44" x2="960" y2="44"/>
<line class="rule" x1="496" y1="92" x2="960" y2="92"/>
<line class="rule" x1="496" y1="212" x2="960" y2="212"/>
<line class="rule" x1="496" y1="252" x2="960" y2="252"/>
</svg>
<div class="t"><h1 class="n">DeepGrid<br>Semi</h1><p class="g">Mature-node silicon for physical systems, set like an engineering journal.</p></div>
</div></body></html>
