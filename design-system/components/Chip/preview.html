<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{padding:20px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.lbl{font:500 .75rem/1.4 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
:focus-visible{outline:var(--focus-width) solid var(--copper-ring);outline-offset:3px}
</style></head><body>
<div class="wrap">
<button class="chip" aria-pressed="true">Motion</button>
<button class="chip" aria-pressed="false">Power</button>
<button class="chip" aria-pressed="false">Sensing</button>
<button class="chip" aria-pressed="false">Interfaces</button>
</div>
<style>.chip{font:500 .75rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 12px;min-height:var(--target-min);cursor:pointer;transition:color .15s,border-color .15s,background-color .15s}
.chip[aria-pressed=true]{color:var(--copper);border-color:var(--copper);background:var(--accent-surface)}</style>
</body></html>
