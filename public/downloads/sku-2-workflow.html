<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKU-2 smart-meter SoC system architecture</title><style>:root{--background:#101212;--surface:#191d1b;--muted:#292d29;--border:#3d453b;--rule:#48544066;--ink:#eeeae2;--ink-2:#a7b09f;--copper:#d4a36e;--cpu:#2f9e8c;--sc-t-control:.875rem;--sc-t-meta:.75rem;--sc-t-block:1.15rem;--sc-t-body:.9375rem;--sc-track-meta:.08em;--sc-radius-sm:4px;--sc-radius-md:6px;--sc-measure:64ch;--text-meta:.75rem;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding:24px}main{max-width:1320px;margin:0 auto}h1{font:400 1.9rem/1.2 Georgia,serif;margin:0 0 6px}main>p{color:var(--ink-2);margin:0 0 18px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.nd{margin:0}.wf-legend{list-style:none;margin:0;padding:14px 18px 18px;display:grid;gap:6px;color:var(--ink-2);font-size:.875rem;border-top:1px solid var(--rule)}.wf-legend b{color:var(--copper);margin-right:6px}/* Native architecture diagram (NativeDiagram in detail.tsx): the site's own design, no raster text */
.nd{margin:40px 0 0;border:1px solid var(--rule);background:var(--surface);border-radius:var(--sc-radius-md,6px);overflow:hidden}
.nd-bar{display:flex;justify-content:space-between;align-items:center;gap:10px 24px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--rule)}
.nd-bar .mono{display:block;font:var(--text-meta) var(--font-mono);letter-spacing:var(--sc-track-meta);color:var(--ink-2)}
.nd-bar strong{font:500 var(--sc-t-block) var(--serif);color:var(--ink)}
.nd-actions{display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap}
.nd-actions .text-link{gap:8px;padding:6px 0;min-height:32px}
.nd-body{position:relative;padding:18px;display:grid;gap:12px}
.nd-body>*{position:relative;z-index:1}
.nd-body>svg.nd-wires{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible;color:var(--border)}
.nd-wire{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.75}
.nd-wire.is-path{color:var(--copper);opacity:.55}
.nd-wire.is-fault{stroke-dasharray:5 4}
.nd-body.has-sel .nd-wire{opacity:.12}
.nd-body.has-sel .nd-wire.is-on{opacity:1;stroke-width:2.25;color:var(--copper)}
.nd-live{margin:0}
.nd-hint{margin:0;padding:10px 18px 0;font-size:var(--sc-t-control);color:var(--ink-2)}
.nd-tip{position:absolute;z-index:5;max-width:340px;display:grid;gap:4px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--sc-radius-sm,4px);background:var(--muted);box-shadow:0 12px 28px -18px #000;font-size:var(--sc-t-meta);line-height:1.5;color:var(--ink-2);pointer-events:none}
.nd-tip strong{color:var(--ink);font-size:var(--sc-t-control)}
.nd-tip-row b{color:var(--copper);font-weight:600;margin-right:4px}
.nd-banner,.nd-io{margin:0;font-size:var(--sc-t-control);line-height:1.55;color:var(--ink-2)}
.nd-io{display:flex;gap:10px;align-items:baseline}
.nd-io .mono,.nd-strip .mono{font:var(--text-meta) var(--font-mono);letter-spacing:var(--sc-track-meta);color:var(--copper)}
.nd-banner{border:1px solid var(--border);border-radius:var(--sc-radius-sm,4px);background:var(--muted);padding:10px 14px}
.nd-frame{background:transparent;border:1px dashed var(--border);border-radius:var(--sc-radius-md,6px);padding:14px;display:grid;gap:12px}
.nd-frame-label{margin:0;font:var(--text-meta) var(--font-mono);letter-spacing:var(--sc-track-meta);color:var(--ink-2)}
.nd-row{display:grid;gap:12px}
.nd-zone{border:1px solid var(--border);border-radius:var(--sc-radius-sm,4px);background:transparent;padding:12px;min-width:0;transition:opacity .2s}
.nd-zone.is-safe{border-color:color-mix(in srgb,var(--cpu) 55%,transparent)}
.nd-zone.is-optional{border-style:dashed}
.nd-zone-name{margin:0 0 10px;font:var(--text-meta) var(--font-mono);letter-spacing:var(--sc-track-meta);text-transform:uppercase;color:var(--ink-2)}
.nd-zone.is-safe .nd-zone-name{color:var(--cpu)}
.nd-blocks{display:grid;gap:8px;grid-template-columns:repeat(var(--c,2),minmax(0,1fr))}
.nd-block{position:relative;border:1px solid var(--border);border-radius:var(--sc-radius-sm,4px);background:var(--background);transition:opacity .2s,border-color .2s;padding:9px 10px;display:grid;gap:3px;align-content:start;grid-column:span var(--s,1)}
.nd-block strong{font-weight:600;font-size:var(--sc-t-control);line-height:1.35;color:var(--ink);padding-right:2.4em}
.nd-block>span:last-child{font-size:var(--sc-t-meta);line-height:1.45;color:var(--ink-2)}
.nd-marks{position:absolute;top:7px;right:7px;display:flex;gap:4px}
.nd-mark{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--copper);color:var(--background);font:600 var(--sc-t-meta)/1 var(--font-mono)}
.nd-mark.is-fault{background:transparent;color:var(--copper);border:1px solid var(--copper)}
.nd-gap{display:block}
.nd-block[role=button]{cursor:pointer}
.nd-block[role=button]:hover,.nd-block.is-on{border-color:var(--copper)}
.nd-block[role=button]:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.nd-body.has-sel .nd-block:not(.is-on),.nd-body.has-sel .nd-io:not(.is-on),.nd-body.has-sel .nd-bus:not(.is-on){opacity:.35}

.nd-zone-note{margin:10px 0 0;font-size:var(--sc-t-meta);line-height:1.5;color:var(--ink-2)}
.nd-bus{margin:0;padding:10px 14px;border-radius:var(--sc-radius-sm,4px);background:var(--muted);border:1px solid var(--border);font-size:var(--sc-t-control);line-height:1.45;color:var(--ink);text-align:center}
.nd-strip{margin:0;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:var(--sc-t-control);color:var(--ink-2)}
.nd>figcaption{padding:12px 18px 14px;color:var(--ink-2);font-size:var(--sc-t-body);line-height:1.6;max-width:calc(var(--sc-measure, 64ch) + 36px);border-top:1px solid var(--rule)}
@media(max-width:900px){.nd-row{grid-template-columns:minmax(0,1fr)!important}}

</style></head><body><main><h1>SKU-2 smart-meter SoC system architecture</h1><p>Pre-silicon architecture, DeepGrid Semi. Values are design targets. Select any block to trace its connections.</p><figure class="nd" aria-label="SKU-2 smart-meter SoC system architecture"><div class="nd-bar"><div><span class="mono">SYSTEM ARCHITECTURE · INTERACTIVE</span><strong>SKU-2 smart-meter SoC system architecture</strong></div></div><p class="nd-hint">Select a block to see what it receives and feeds; the arrows show each connection.</p><div class="nd-body"><svg class="nd-wires" aria-hidden="true"></svg><p class="nd-io" data-k="IN" data-t="External inputs" data-s="V / I sense · 6 channels"><span class="mono">IN</span>V / I sense · 6 channels</p><div class="nd-frame"><p class="nd-frame-label mono">SKU-2  ·  130 nm CMOS  ·  200 MHz</p><div class="nd-row" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1.4fr) minmax(0,0.7fr)"><section class="nd-zone" aria-label="Metrology" data-k="Z1" data-t="Metrology"><p class="nd-zone-name">Metrology</p><div class="nd-blocks" role="group" aria-label="Metrology" style="--c:3;--cm:2"><div class="nd-block" data-k="AFE" data-t="DG-AFE6" data-s="6-ch 24-bit delta-sigma" role="button" tabindex="0" aria-pressed="false"><span class="nd-marks"><span class="nd-mark" aria-label="Marker 1">①</span></span><strong>DG-AFE6</strong><span>6-ch 24-bit delta-sigma</span></div><div class="nd-block" data-k="DEC" data-t="DECIM" data-s="sinc³ · OSR 256" role="button" tabindex="0" aria-pressed="false"><span class="nd-marks"><span class="nd-mark" aria-label="Marker 2">②</span></span><strong>DECIM</strong><span>sinc³ · OSR 256</span></div><div class="nd-block" data-k="MET" data-t="METRO" data-s="P Q S · THD-15" role="button" tabindex="0" aria-pressed="false"><span class="nd-marks"><span class="nd-mark" aria-label="Marker 3">③</span><span class="nd-mark" aria-label="Marker 4">④</span></span><strong>METRO</strong><span>P Q S · THD-15</span></div></div></section><section class="nd-zone" aria-label="Compute + security" data-k="Z2" data-t="Compute + security"><p class="nd-zone-name">Compute + security</p><div class="nd-blocks" role="group" aria-label="Compute + security" style="--c:3;--cm:2"><div class="nd-block" data-k="CPU" data-t="DGridRiscV" data-s="RV32IM_Zicsr" role="button" tabindex="0" aria-pressed="false"><strong>DGridRiscV</strong><span>RV32IM_Zicsr</span></div><div class="nd-block" data-k="DMA" data-t="DMA" data-s="4-ch" role="button" tabindex="0" aria-pressed="false"><strong>DMA</strong><span>4-ch</span></div><div class="nd-block" data-k="SE" data-t="DG-SE" data-s="AES-256 · SHA-256" role="button" tabindex="0" aria-pressed="false"><strong>DG-SE</strong><span>AES-256 · SHA-256</span></div></div></section><section class="nd-zone" aria-label="Always-on" data-k="Z3" data-t="Always-on"><p class="nd-zone-name">Always-on</p><div class="nd-blocks" role="group" aria-label="Always-on" style="--c:1;--cm:1"><div class="nd-block" data-k="PMU" data-t="PMU + RTC" data-s="32.768 kHz XTAL · brownout 2.0 V · &lt;2 µW" role="button" tabindex="0" aria-pressed="false"><strong>PMU + RTC</strong><span>32.768 kHz XTAL · brownout 2.0 V · &lt;2 µW</span></div></div></section></div><p class="nd-bus" data-k="BUS" data-t="AHB-Lite multilayer" data-s="AHB-Lite multilayer  ·  32-bit  ·  4 masters / 9 slaves  ·  200 MHz">AHB-Lite multilayer  ·  32-bit  ·  4 masters / 9 slaves  ·  200 MHz</p><div class="nd-row" style="grid-template-columns:minmax(0,1fr)"><section class="nd-zone" aria-label="Peripherals" data-k="Z4" data-t="Peripherals"><p class="nd-zone-name">Peripherals</p><div class="nd-blocks" role="group" aria-label="Peripherals" style="--c:6;--cm:2"><div class="nd-block" data-k="RTC" data-t="RTC" data-s="tamper log" role="button" tabindex="0" aria-pressed="false"><strong>RTC</strong><span>tamper log</span></div><div class="nd-block" data-k="TIM" data-t="Timer" data-s="capture / compare" role="button" tabindex="0" aria-pressed="false"><strong>Timer</
