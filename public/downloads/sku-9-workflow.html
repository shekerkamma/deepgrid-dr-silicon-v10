<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKU-9 zonal controller and gateway system architecture</title><style>:root{--background:#101212;--surface:#191d1b;--muted:#292d29;--border:#3d453b;--rule:#48544066;--ink:#eeeae2;--ink-2:#a7b09f;--copper:#d4a36e;--cpu:#2f9e8c;--sc-t-control:.875rem;--sc-t-meta:.75rem;--sc-t-block:1.15rem;--sc-t-body:.9375rem;--sc-track-meta:.08em;--sc-radius-sm:4px;--sc-radius-md:6px;--sc-measure:64ch;--text-meta:.75rem;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding:24px}main{max-width:1320px;margin:0 auto}h1{font:400 1.9rem/1.2 Georgia,serif;margin:0 0 6px}main>p{color:var(--ink-2);margin:0 0 18px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.nd{margin:0}.wf-legend{list-style:none;margin:0;padding:14px 18px 18px;display:grid;gap:6px;color:var(--ink-2);font-size:.875rem;border-top:1px solid var(--rule)}.wf-legend b{color:var(--copper);margin-right:6px}/* Native architecture diagram (NativeDiagram in detail.tsx): the site's own design, no raster text */
.nd{margin:40px 0 0;border:1px solid var(--rule);background:var(--surface);border-radius:var(--sc-radius-md,6px);overflow:hidden}
.nd-bar{display:flex;justify-content:space-between;align-items:center;gap:10px 24px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--rule)}
.nd-bar .mono{display:block;font:var(--text-meta) var(--font-mono);letter-spacing:var(--sc-track-meta);color:var(--ink-2)}
.nd-bar strong{font:500 var(--sc-t-block) var(--serif);color:var(--ink)}
.nd-actions{display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap}
.nd-actions .text-link{gap:8px;padding:6px 0;min-height:32px}
.nd-body{position:relative;padding:18px;display:grid;gap:12px}
.nd-body>*{position:relative;z-index:1}
.nd-body>svg.nd-wires{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible;color:var(--border)}
.nd-wire{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.75}
.nd-wire.is-path{color:var(--copper);opacity:.55}
.nd-wire.is-fault{stroke-dasharray:5 4}
.nd-body.has-sel .nd-wire{opacity:.12}
.nd-body.has-sel .nd-wire.is-on{opacity:1;stroke-width:2.25;color:var(--copper)}
.nd-live{margin:0}
.nd-hint{margin:0;padding:10px 18px 0;font-size:var(--sc-t-control);color:var(--ink-2)}
.nd-tip{position:absolute;z-index:5;max-width:340px;display:grid;gap:4px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--sc-radius-sm,4px);background:var(--muted);box-shadow:0 12px 28px -18px #000;font-size:var(--sc-t-meta);line-height:1.5;color:var(--ink-2);pointer-events:none}
.nd-tip strong{color:var(--ink);font-size:var(--sc-t-control)}
.nd-tip-row b{color:var(--copper);font-weight:600;margin-right:4px}
.nd-banner,.nd-io{margin:0;font-size:var(--sc-t-control);line-height:1.55;color:var(--ink-2)}
.nd-io{display:flex;gap:10px;align-items:baseline}
.nd-io .mono,.nd-strip .mono{font:var(--text-meta) var(--font-mono);letter-spacing:var(--sc-track-meta);color:var(--copper)}
.nd-banner{border:1px solid var(--border);border-radius:var(--sc-radius-sm,4px);background:var(--muted);padding:10px 14px}
.nd-frame{background:transparent;border:1px dashed var(--border);border-radius:var(--sc-radius-md,6px);padding:14px;display:grid;gap:12px}
.nd-frame-label{margin:0;font:var(--text-meta) var(--font-mono);letter-spacing:var(--sc-track-meta);color:var(--ink-2)}
.nd-row{display:grid;gap:12px}
.nd-zone{border:1px solid var(--border);border-radius:var(--sc-radius-sm,4px);background:transparent;padding:12px;min-width:0;transition:opacity .2s}
.nd-zone.is-safe{border-color:color-mix(in srgb,var(--cpu) 55%,transparent)}
.nd-zone.is-optional{border-style:dashed}
.nd-zone-name{margin:0 0 10px;font:var(--text-meta) var(--font-mono);letter-spacing:var(--sc-track-meta);text-transform:uppercase;color:var(--ink-2)}
.nd-zone.is-safe .nd-zone-name{color:var(--cpu)}
.nd-blocks{display:grid;gap:8px;grid-template-columns:repeat(var(--c,2),minmax(0,1fr))}
.nd-block{position:relative;border:1px solid var(--border);border-radius:var(--sc-radius-sm,4px);background:var(--background);transition:opacity .2s,border-color .2s;padding:9px 10px;display:grid;gap:3px;align-content:start;grid-column:span var(--s,1)}
.nd-block strong{font-weight:600;font-size:var(--sc-t-control);line-height:1.35;color:var(--ink);padding-right:2.4em}
.nd-block>span:last-child{font-size:var(--sc-t-meta);line-height:1.45;color:var(--ink-2)}
.nd-marks{position:absolute;top:7px;right:7px;display:flex;gap:4px}
.nd-mark{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--copper);color:var(--background);font:600 var(--sc-t-meta)/1 var(--font-mono)}
.nd-mark.is-fault{background:transparent;color:var(--copper);border:1px solid var(--copper)}
.nd-gap{display:block}
.nd-block[role=button]{cursor:pointer}
.nd-block[role=button]:hover,.nd-block.is-on{border-color:var(--copper)}
.nd-block[role=button]:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.nd-body.has-sel .nd-block:not(.is-on),.nd-body.has-sel .nd-io:not(.is-on),.nd-body.has-sel .nd-bus:not(.is-on){opacity:.35}
@media (prefers-reduced-motion:reduce){.nd-zone,.nd-block{transition:none}}
.nd-zone-note{margin:10px 0 0;font-size:var(--sc-t-meta);line-height:1.5;color:var(--ink-2)}
.nd-bus{margin:0;padding:10px 14px;border-radius:var(--sc-radius-sm,4px);background:var(--muted);border:1px solid var(--border);font-size:var(--sc-t-control);line-height:1.45;color:var(--ink);text-align:center}
.nd-strip{margin:0;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:var(--sc-t-control);color:var(--ink-2)}
.nd>figcaption{padding:12px 18px 14px;color:var(--ink-2);font-size:var(--sc-t-body);line-height:1.6;max-width:calc(var(--sc-measure, 64ch) + 36px);border-top:1px solid var(--rule)}
@media(max-width:900px){.nd-row{grid-template-columns:minmax(0,1fr)!important}}
@media(max-width:560px){.nd-body{padding:12px}.nd-frame{padding:10px}.nd-blocks{grid-template-columns:repeat(var(--cm,2),minmax(0,1fr))}.nd-block{grid-column:span var(--sm,1)}}
</style></head><body><main><h1>SKU-9 zonal controller and gateway system architecture</h1><p>Pre-silicon architecture, DeepGrid Semi. Values are design targets. Select any block to trace its connections.</p><figure class="nd" aria-label="SKU-9 zonal controller and gateway system architecture"><div class="nd-bar"><div><span class="mono">SYSTEM ARCHITECTURE · INTERACTIVE</span><strong>SKU-9 zonal controller and gateway system architecture</strong></div></div><p class="nd-hint">Select a block to see what it receives and feeds; the arrows show each connection.</p><div class="nd-body"><svg class="nd-wires" aria-hidden="true"></svg><p class="nd-banner">Scope, as the sheet states it: 130 nm at 200 MHz owns the zonal layer: gateway, smart I/O, safety and security edge. Central software-defined-vehicle compute is a sub-10 nm part and is not claimed here.</p><div class="nd-frame"><p class="nd-frame-label mono">SKU-9  ·  130 nm CMOS and BCD  ·  200 MHz</p><div class="nd-row" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)"><section class="nd-zone is-safe" aria-label="Safety island" data-k="Z1" data-t="Safety island"><p class="nd-zone-name">Safety island</p><div class="nd-blocks" role="group" aria-label="Safety island" style="--c:2;--cm:2"><div class="nd-block" data-k="CPU" data-t="DGridRiscV × 2" data-s="RV32IM_Zicsr · lockstep · 200 MHz · +2 cycle skew · PMP · ECC" role="button" tabindex="0" aria-pressed="false"><strong>DGridRiscV × 2</strong><span>RV32IM_Zicsr · lockstep · 200 MHz · +2 cycle skew · PMP · ECC</span></div><div class="nd-block" data-k="CMP" data-t="Comparator" data-s="bus + retire · mismatch → safe state" role="button" tabindex="0" aria-pressed="false"><strong>Comparator</strong><span>bus + retire · mismatch → safe state</span></div><div class="nd-block" data-k="FFI" data-t="Freedom from interference" data-s="MPU + bus firewall" role="button" tabindex="0" aria-pressed="false" style="--s:2;--sm:2"><span class="nd-marks"><span class="nd-mark" aria-label="Marker 5">⑤</span></span><strong>Freedom from interference</strong><span>MPU + bus firewall</span></div></div></section><section class="nd-zone" aria-label="Security" data-k="Z2" data-t="Security"><p class="nd-zone-name">Security</p><div class="nd-blocks" role="group" aria-label="Security" style="--c:2;--cm:2"><div class="nd-block" data-k="HSM" data-t="HSM" data-s="hardware security module · AES-256 · ECC-256 · true RNG" role="button" tabindex="0" aria-pressed="false"><strong>HSM</strong><span>hardware security module · AES-256 · ECC-256 · true RNG</span></div><div class="nd-block" data-k="SB" data-t="Secure boot" data-s="root of trust · OTP key store · A/B slots" role="button" tabindex="0" aria-pressed="false"><strong>Secure boot</strong><span>root of trust · OTP key store · A/B slots</span></div><div class="nd-block" data-k="OTA" data-t="OTA engine" data-s="signed image verify + rollback" role="button" tabindex="0" aria-pressed="false" style="--s:2;--sm:2"><strong>OTA engine</strong><span>signed image verify + rollback</span></div></div></section><section class="nd-zone" aria-label="Real-time control" data-k="Z3" data-t="Real-time control"><p class="nd-zone-name">Real-time control</p><div class="nd-blocks" role="group" aria-label="Real-time control" style="--c:2;--cm:2"><div class="nd-block" data-k="TSN" data-t="TSN switch" data-s="802.1Qbv · time-aware shaper" role="button" tabindex="0" aria-pressed="false"><strong>TSN switch</strong><span>802.1Qbv · time-aware shaper</span></div><div class="nd-block" data-k="PTP" data-t="PTP" data-s="802.1AS clock · sub-µs sync" role="button" tabindex="0" aria-pressed="false"><span class="nd-marks"><span class="nd-mark" aria-label="Marker 2">②</span></span><strong>PTP</strong><span>802.1AS clock · sub-µs sync</span></div><div class="nd-block" data-k="SR" data-t="Service router" data-s="SOME/IP + DoIP" role="button" tabindex="0" aria-pressed="false" style="--s:2;--sm:2"><span class="nd-marks"><span class="nd-mark"
