<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKU-7 77 GHz MIMO radar system architecture</title><style>:root{--background:#101212;--surface:#191d1b;--muted:#292d29;--border:#3d453b;--rule:#48544066;--ink:#eeeae2;--ink-2:#a7b09f;--copper:#d4a36e;--cpu:#2f9e8c;--sc-t-control:.875rem;--sc-t-meta:.75rem;--sc-t-block:1.15rem;--sc-t-body:.9375rem;--sc-track-meta:.08em;--sc-radius-sm:4px;--sc-radius-md:6px;--sc-measure:64ch;--text-meta:.75rem;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding:24px}main{max-width:1320px;margin:0 auto}h1{font:400 1.9rem/1.2 Georgia,serif;margin:0 0 6px}main>p{color:var(--ink-2);margin:0 0 18px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.nd{margin:0}.wf-legend{list-style:none;margin:0;padding:14px 18px 18px;display:grid;gap:6px;color:var(--ink-2);font-size:.875rem;border-top:1px solid var(--rule)}.wf-legend b{color:var(--copper);margin-right:6px}/* Native architecture diagram (NativeDiagram in detail.tsx): the site's own design, no raster text */

.nd-bar .mono{display:block;font:var(--text-meta) var(--font-mono);letter-spacing:var(--sc-track-meta);color:var(--ink-2)}
.nd-bar strong{font:500 var(--sc-t-block) var(--serif);color:var(--ink)}

.nd-io{display:flex;gap:10px;align-items:baseline}

.nd-gap{display:block}

</style></head><body><main><h1>SKU-7 77 GHz MIMO radar system architecture</h1><p>Pre-silicon architecture, DeepGrid Semi. Values are design targets. Select any block to trace its connections.</p><figure class="nd" aria-label="SKU-7 77 GHz MIMO radar system architecture"><div class="nd-bar"><div><span class="mono">SYSTEM ARCHITECTURE · INTERACTIVE</span><strong>SKU-7 77 GHz MIMO radar system architecture</strong></div></div><p class="nd-hint">Select a block to see what it receives and feeds; the arrows show each connection.</p><div class="nd-body"><svg class="nd-wires" aria-hidden="true"></svg><div class="nd-frame"><p class="nd-frame-label mono">SKU-7  ·  two dies: SiGe HBT front end (IHP SG13G2) + 130 nm CMOS baseband at 200 MHz</p><div class="nd-row" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><section class="nd-zone" aria-label="Chirp synthesis + transmit · SiGe die" data-k="Z1" data-t="Chirp synthesis + transmit · SiGe die"><p class="nd-zone-name">Chirp synthesis + transmit · SiGe die</p><div class="nd-blocks" role="group" aria-label="Chirp synthesis + transmit · SiGe die" style="--c:4;--cm:2"><div class="nd-block" data-k="XT" data-t="XTAL" data-s="40 MHz" role="button" tabindex="0" aria-pressed="false"><strong>XTAL</strong><span>40 MHz</span></div><div class="nd-block" data-k="RG" data-t="Ramp gen" data-s="chirp profile · sawtooth / triangle" role="button" tabindex="0" aria-pressed="false"><span class="nd-marks"><span class="nd-mark" aria-label="Marker 1">①</span></span><strong>Ramp gen</strong><span>chirp profile · sawtooth / triangle</span></div><div class="nd-block" data-k="PLL" data-t="PLL" data-s="fractional-N · 1 MHz loop BW" role="button" tabindex="0" aria-pressed="false"><strong>PLL</strong><span>fractional-N · 1 MHz loop BW</span></div><div class="nd-block" data-k="VCO" data-t="VCO" data-s="38.5 GHz · SiGe HBT" role="button" tabindex="0" aria-pressed="false"><strong>VCO</strong><span>38.5 GHz · SiGe HBT</span></div><div class="nd-gap" aria-hidden="true"></div><div class="nd-block" data-k="PA2" data-t="PA · TX2" data-s="13 dBm" role="button" tabindex="0" aria-pressed="false"><strong>PA · TX2</strong><span>13 dBm</span></div><div class="nd-block" data-k="PA1" data-t="PA · TX1" data-s="13 dBm" role="button" tabindex="0" aria-pressed="false"><span class="nd-marks"><span class="nd-mark" aria-label="Marker 2">②</span></span><strong>PA · TX1</strong><span>13 dBm</span></div><div class="nd-block" data-k="X2" data-t="× 2" data-s="77 GHz" role="button" tabindex="0" aria-pressed="false"><strong>× 2</strong><span>77 GHz</span></div></div></section><section class="nd-zone" aria-label="Signal processing · CMOS die" data-k="Z2" data-t="Signal processing · CMOS die"><p class="nd-zone-name">Signal processing · CMOS die</p><div class="nd-blocks" role="group" aria-label="Signal processing · CMOS die" style="--c:2;--cm:2"><div class="nd-block" data-k="ADC" data-t="ADC × 4" data-s="12-bit · 40 MSPS" role="button" tabindex="0" aria-pressed="false"><span class="nd-marks"><span class="nd-mark" aria-label="Marker 4">④</span></span><strong>ADC × 4</strong><span>12-bit · 40 MSPS</span></div><div class="nd-block" data-k="WIN" data-t="Windowing" data-s="Hann / Blackman" role="button" tabindex="0" aria-pressed="false"><strong>Windowing</strong><span>Hann / Blackman</span></div><div class="nd-block" data-k="DF" data-t="Doppler FFT" data-s="128-pt across chirps · velocity bins" role="button" tabindex="0" aria-pressed="false"><strong>Doppler FFT</strong><span>128-pt across chirps · velocity bins</span></div><div class="nd-block" data-k="RF" data-t="Range FFT" data-s="1024-pt radix-4 · 26 µs per chirp" role="button" tabindex="0" aria-pressed="false"><strong>Range FFT</strong><span>1024-pt radix-4 · 26 µs per chirp</span></div><div class="nd-block" data-k="RD" data-t="Range-Doppler" data-s="map buffer · SRAM 512 KB" role="button" tabindex="0" aria-pressed="false" style="--s:2;--sm:2"><strong>Range-Doppler</strong><span>map buffer ·
